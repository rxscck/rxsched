    th, td { border: 1px solid #dcdcc0; padding: 14px; text-align: center; transition: background-color 0.3s ease; }

    thead tr:nth-child(2) th { background-color: var(--color-accent); color: var(--color-text-light); font-weight: 700; border-top: 2px solid var(--color-primary); }

    tbody tr:nth-child(odd) td:not(:first-child) { background-color: #ffffff; }
    tbody tr:nth-child(even) td:not(:first-child) { background-color: #f7f7f2; }
    tbody td:not(:first-child) { font-weight: bold; }

    @media (hover: hover) and (pointer: fine) {
        tbody td:not(:first-child):hover { background-color: var(--color-hover); cursor: pointer; }
    }

    /* ===== 日期輸入框 ===== */
    input[type=date] {
        padding: 12px 18px;
        border-radius: 8px;
        border: 1px solid var(--color-border);
        font-family: 'Noto Sans TC', sans-serif;
        font-size: 1.1em;
        color: var(--color-text-dark);
        background-color: #ffffff;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        vertical-align: middle;
    }

    /* ===== 一般按鈕（查詢）：浮起陰影 ===== */
    button {
        padding: 12px 22px;
        border-radius: 10px;
        border: none;
        font-family: 'Noto Sans TC', sans-serif;
        font-size: 1.1em;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--color-text-light);
        background-color: var(--color-primary);
        cursor: pointer;
        margin-left: 10px;
        vertical-align: middle;
        transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
        box-shadow: 0 4px 0 #26344a, 0 8px 14px rgba(0, 0, 0, 0.22);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }

    /* hover 只在真正有滑鼠游標的裝置生效（手機不會卡色） */
    @media (hover: hover) and (pointer: fine) {
        button:hover {
            background-color: var(--color-accent);
            transform: translateY(-3px);
            box-shadow: 0 7px 0 #9c6d60, 0 12px 22px rgba(0, 0, 0, 0.28);
        }
    }

    /* 按下回饋：觸控與滑鼠皆適用，放開即自動解除 */
    button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #26344a, 0 4px 8px rgba(0, 0, 0, 0.18);
    }

    /* ===== 正常 / 特別：外框群組 ===== */
    .mode-group {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-left: 14px;
        padding: 6px;
        border: 2px solid var(--color-accent);
        border-radius: 14px;
        background-color: rgba(192, 140, 124, 0.14);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.12);
        vertical-align: middle;
    }
    .mode-group .mode-btn {
        margin-left: 0;
        padding: 10px 20px;
        background-color: #ffffff;
        color: var(--color-primary);
        border: 2px solid transparent;
        box-shadow: 0 3px 0 rgba(60, 79, 109, 0.35), 0 5px 10px rgba(0, 0, 0, 0.15);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }

    /* 模式按鈕 hover：同樣包進媒體查詢，手機點擊後不會卡色 */
    @media (hover: hover) and (pointer: fine) {
        .mode-group .mode-btn:hover {
            background-color: #fdf8f3;
            color: var(--color-accent);
            transform: translateY(-2px);
            box-shadow: 0 5px 0 rgba(192, 140, 124, 0.55), 0 8px 14px rgba(0, 0, 0, 0.20);
        }
        .mode-group .mode-btn.active:hover {
            background-color: #b57f6f;
            transform: translateY(-1px);
            box-shadow: 0 5px 0 #9c6d60, 0 9px 16px rgba(0, 0, 0, 0.24);
        }
    }

    /* 選中狀態：由 JS 的 .active 控制，不受 hover 影響 */
    .mode-group .mode-btn.active {
        background-color: var(--color-accent);
        color: var(--color-text-light);
        border-color: #9c6d60;
        transform: translateY(1px);
        box-shadow: 0 3px 0 #9c6d60, 0 6px 12px rgba(0, 0, 0, 0.22);
    }

    .query-label { font-size: 1.3em; margin-right: 8px; }
    .off-shift { color: red; font-weight: bold; }
    .orange-shift { color: #f97316 !important; font-weight: bold; }
    .purple-shift { color: #8b5cf6 !important; font-weight: bold; }
    .black-off { color: #000000 !important; font-weight: bold; }

    td.stat { color: #1d4ed8 !important; font-family: 'Zen Old Mincho', serif; font-size: 1.2em;
        font-weight: 700; border-left: 2px solid #000000 !important; cursor: default !important; }

    <span class="mode-group">

</div>

    6: ["晏璿", "宗驦", "藥助", "信樺"]
};

function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn_normal').classList.toggle('active', mode === 'normal');
    document.getElementById('btn_special').classList.toggle('active', mode === 'special');
    showSchedule();
}

function getComboInfo(monday) {
    const msPerDay = 86400000;
    const diffDays = Math.round((monday - data_start_date) / msPerDay);
    const weekIndex = Math.floor(diffDays / 7);
    const weekInCycle = ((weekIndex % TOTAL_WEEKS) + TOTAL_WEEKS) % TOTAL_WEEKS;
    const comboIndex = Math.floor(weekInCycle / weeks_per_combo);
    return { weekIndex, weekInCycle, comboIndex, a1: comboIndex + 1 };
}

function getWeekSchedule(selected_date) {
    const monday_of_selected_week = new Date(selected_date);
    const dayOfWeek = monday_of_selected_week.getDay();
    const diffToMonday = (dayOfWeek === 0) ? -6 : (1 - dayOfWeek);
    monday_of_selected_week.setDate(monday_of_selected_week.getDate() + diffToMonday);
    monday_of_selected_week.setHours(0, 0, 0, 0);

    const msPerDay = 1000 * 60 * 60 * 24;
    const diffInDays = Math.round((monday_of_selected_week - data_start_date) / msPerDay);
    const start_data_index = ((diffInDays % TOTAL_DAYS) + TOTAL_DAYS) % TOTAL_DAYS;

    const { a1 } = getComboInfo(monday_of_selected_week);
    const persons_order = A1_ORDERS[a1].slice();

    const person_weekly_shifts = {};
    persons_order.forEach(p => person_weekly_shifts[p] = Array(7).fill(""));

    for (let i = 0; i < 7; i++) {
        const idx = (start_data_index + i) % merged_schedule_data.length;
        const daily = merged_schedule_data[idx];
        daily.forEach((item, rowIdx) => {
            const person = persons_order[rowIdx];
            if (person) person_weekly_shifts[person][i] = item[1];
        });
    }
    return { monday_of_selected_week, person_weekly_shifts, persons_order };
}

function getViewStartMonday(selected_date) {
    const monday = new Date(selected_date);
    const dayOfWeek = monday.getDay();
    monday.setDate(monday.getDate() + ((dayOfWeek === 0) ? -6 : (1 - dayOfWeek)));
    monday.setHours(0, 0, 0, 0);
    const msPerDay = 1000 * 60 * 60 * 24;
    const diffInDays = Math.round((monday - data_start_date) / msPerDay);
    const weekIndex = Math.floor(diffInDays / 7);
    const weekInCycle = ((weekIndex % TOTAL_WEEKS) + TOTAL_WEEKS) % TOTAL_WEEKS;
    const weekInCombo = weekInCycle % weeks_per_combo;
    const offsetWeeks = weekInCombo % weeks_per_view;
    monday.setDate(monday.getDate() - offsetWeeks * 7);
    return monday;
}

function formatDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function countShiftScore(shift) {
    if (!shift) return 0;
    const matches = shift.match(/[MAN]/g);
    return matches ? matches.length : 0;
}

function getComboRotationPersons(monday) {
    const { a1 } = getComboInfo(monday);
    const order = A1_ORDERS[a1];
    const nonPharmacist = order.filter(name => name !== '藥助');
    return [nonPharmacist[0], nonPharmacist[1]];
}

function renderWeek(weekSchedule, rangeEl, dateRowEl, tableEl) {
    const { monday_of_selected_week, person_weekly_shifts, persons_order } = weekSchedule;

    const week_start = new Date(monday_of_selected_week);
    const week_end = new Date(monday_of_selected_week);
    week_end.setDate(week_end.getDate() + 6);
    rangeEl.innerText = `週期：${formatDate(week_start)} 至 ${formatDate(week_end)}`;

    dateRowEl.innerHTML = '<th>日期</th>';
    let current_date = new Date(monday_of_selected_week);
    for (let i = 0; i < 7; i++) {
        const dateCell = document.createElement("th");
        dateCell.textContent = `${current_date.getMonth() + 1}/${current_date.getDate()}`;
        dateRowEl.appendChild(dateCell);
        current_date.setDate(current_date.getDate() + 1);
    }
    const statHeader = document.createElement("th");
    statHeader.textContent = "統計";
    statHeader.classList.add("stat");
    dateRowEl.appendChild(statHeader);

    let rotationPerson = null;
    let replacePositions = [];
    if (currentMode === 'special') {
        const { weekInCycle } = getComboInfo(monday_of_selected_week);
        const weekInCombo = weekInCycle % weeks_per_combo;
        const twoWeekGroup = Math.floor(weekInCombo / 2);
        const weekInTwoWeek = weekInCombo % 2;
        const rotationPersons = getComboRotationPersons(monday_of_selected_week);
        rotationPerson = (twoWeekGroup % 2 === 0) ? rotationPersons[1] : rotationPersons[0];
        /* 第一週替換週一、二、三、四（索引 0,1,2,3）；第二週替換週二、六（索引 1,5） */
        replacePositions = (weekInTwoWeek === 0) ? [0, 1, 2, 3] : [1, 5];
    }

    const tbody = tableEl.querySelector("tbody");
    tbody.innerHTML = "";
    persons_order.forEach((person) => {
        const displayName = (currentMode === 'special' && person === '藥助') ? '怡瑱' : person;
        const row = document.createElement("tr");
        const nameCell = document.createElement("td");
        nameCell.textContent = displayName;
        row.appendChild(nameCell);

        let shifts;
        // 記錄「因特殊規則而被改成 AN」的位置索引，用來標橘色
        let replacedPositions = new Set();
        if (currentMode === 'special' && person === '藥助') {
            shifts = ['M', 'M', 'M', 'OFF', 'OFF', 'M', 'OFF'];
        } else {
            shifts = [...person_weekly_shifts[person]];
            if (currentMode === 'special' && person === rotationPerson) {
                replacePositions.forEach(pos => {
                    // 只有原本不是 AN 的位置才算「班別變動」，才標橘色
                    if (shifts[pos] !== 'AN') {
                        replacedPositions.add(pos);
                    }
                    shifts[pos] = 'AN';
                });
            }
        }

        let total_score = 0;
        shifts.forEach((shift, idx) => {
            const cell = document.createElement("td");
            cell.textContent = shift;
            if (replacedPositions.has(idx)) {
                cell.classList.add('orange-shift');
            }
            if (currentMode === 'special' && person === '藥助') {
                if (shift === 'M') cell.classList.add('purple-shift');
                else if (shift === 'OFF') cell.classList.add('black-off');
            } else if (shift === "OFF") {
                cell.classList.add("off-shift");
            }
            total_score += countShiftScore(shift);
            row.appendChild(cell);
        });

        const statCell = document.createElement("td");
        statCell.textContent = total_score;
        statCell.classList.add("stat");
        row.appendChild(statCell);
        tbody.appendChild(row);
    });
}

function showSchedule() {
    const queryInput = document.getElementById("query_date").value;
    let selected_date;
    if (queryInput) {
        const parts = queryInput.split("-").map(Number);
        selected_date = new Date(parts[0], parts[1] - 1, parts[2]);
        if (isNaN(selected_date.getTime())) {
            alert("日期格式無效，請重新選擇。");
            return;
        }
    } else {
        selected_date = new Date();
    }

    const firstWeek = getWeekSchedule(getViewStartMonday(selected_date));
    renderWeek(firstWeek,
        document.getElementById("week_range"),
        document.getElementById("date_row"),
        document.getElementById("schedule_table"));

    const nextMonday = new Date(firstWeek.monday_of_selected_week);
    nextMonday.setDate(nextMonday.getDate() + 7);
    const secondWeek = getWeekSchedule(nextMonday);
    renderWeek(secondWeek,
        document.getElementById("week_range_2"),
        document.getElementById("date_row_2"),
        document.getElementById("schedule_table_2"));
}

document.addEventListener("DOMContentLoaded", () => {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    document.getElementById("query_date").value = `${year}-${month}-${day}`;
    showSchedule();
});
</script>
